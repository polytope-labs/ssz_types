[package]
name = "ssz_types"
version = "0.14.1"
edition = "2021"
description = "List, vector and bitfield types for SSZ"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/sigp/ssz_types"
documentation = "https://docs.rs/ssz_types"
keywords = ["ethereum"]
categories = ["cryptography::cryptocurrencies"]

[features]
default = ["std", "ring"]
std = ["tree_hash/std", "ethereum_ssz/std", "ethereum_serde_utils/std", "serde/std", "itertools/use_std", "codec?/std"]
ring = ["tree_hash/ring"]
sha2 = ["tree_hash/sha2"]
scale = ["dep:codec"]
runtime_types = ["dep:educe"]
context_deserialize = ["dep:context_deserialize"]

[dependencies]
tree_hash = { version = "0.12.0", default-features = false }
ethereum_serde_utils = { version = "0.8.0", default-features = false }
ethereum_ssz = { version = "0.10.0", default-features = false }
serde = { version = "1.0.0", default-features = false, features = ["alloc"] }
serde_derive = "1.0.0"
typenum = { version = "1.12.0", default-features = false }
codec = { package = "parity-scale-codec", version = "3.2.2", default-features = false, features = ["derive"], optional = true }
smallvec = { version = "1.8.0", default-features = false }
itertools = { version = "0.14.0", default-features = false, features = ["use_alloc"] }

# Optional dependencies
arbitrary = { version = "1.0", features = ["derive"], optional = true }
context_deserialize = { version = "0.2", optional = true }
educe = { version = "0.6", optional = true }

[dev-dependencies]
criterion = "0.7.0"
serde_json = "1.0.0"
tree_hash_derive = "0.12.0"

[[bench]]
harness = false
name = "encode_decode"

[patch.crates-io]
tree_hash = { git = "https://github.com/polytope-labs/tree_hash", rev = "e5e945efd51e691efc86cc3998a6d16ad0754acf" }
tree_hash_derive = { git = "https://github.com/polytope-labs/tree_hash", rev = "e5e945efd51e691efc86cc3998a6d16ad0754acf" }
ethereum_ssz = { git = "https://github.com/polytope-labs/ethereum_ssz", rev = "8658e3af0b448a4c90f47702616b0e78a696bb18" }
ethereum_ssz_derive = { git = "https://github.com/polytope-labs/ethereum_ssz", rev = "8658e3af0b448a4c90f47702616b0e78a696bb18" }
ethereum_serde_utils = { git = "https://github.com/polytope-labs/ethereum_serde_utils", rev = "5d953c2f15b1f52c67529b117b4878d946f9295d" }
ethereum_hashing = { git = "https://github.com/polytope-labs/ethereum_hashing", rev = "30d2638547ce44cac0cdea44db32e9247d227a4a" }
